<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo.png" />

    <!-- Google Fonts: Lexend -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    >

    <!-- Google Fonts: Noto Sans -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dermalert</title>
    <meta name="description" content="Triagem dermatológica inteligente, simples e segura." />
    <meta name="theme-color" content="#1D366F" />
    <style>
      html {
        background: #f7fbfd;
      }

      body {
        margin: 0;
        background: #f7fbfd;
        color: #172033;
        font-family: Lexend, "Noto Sans", sans-serif;
      }

      html.da-booting body {
        opacity: 0;
      }

      html.da-ready body {
        opacity: 1;
        transition: opacity 120ms ease-out;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0e1a2b;
          color: #f3f7ff;
        }
      }
    </style>
    <script>
      document.documentElement.classList.add('da-booting');
      window.addEventListener(
        'DOMContentLoaded',
        () => requestAnimationFrame(() => document.documentElement.classList.add('da-ready')),
        { once: true }
      );
      window.setTimeout(() => document.documentElement.classList.add('da-ready'), 700);
    </script>
    <script type="module" crossorigin src="./assets/main-DWfHmOoD.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-DhMA6jNC.css">
  </head>

  <body class="font-sans antialiased bg-white text-gray-800 dark:bg-[#0E1A2B] dark:text-gray-100">
    <a href="#conteudo"
       class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[100]
              focus:bg-white focus:text-gray-900 focus:px-4 focus:py-2 focus:rounded-lg focus:shadow">
      Pular para o conteúdo
    </a>

    <div class="min-h-screen flex flex-col items-center w-full bg-white dark:bg-[#0E1A2B]">
      <!-- MAIN -->
      <main id="conteudo" class="flex-1 w-full flex flex-col items-center">
        <div class="dermalert-hero-shell-home w-full">
          <!-- HEADER -->
          <div id="app-header" class="w-full"></div>

          <!-- HERO -->
          <div id="app-hero" class="w-full"></div>
        </div>

        <!-- FEATURES / PILLS -->
        <div id="app-features-pills" class="w-full -mt-8 md:-mt-10 relative z-10"></div>

        <!-- PARTNERS -->
        <div id="app-partners" class="w-full"></div>

        <!-- FEATURES / BASE (↓ tirando margem inferior pra colar no about) -->
        <div id="app-features-base" class="w-full"></div>

        <!-- SOBRE O DERMALERT (↓ sem margem superior extra) -->
        <div id="app-about" class="w-full"></div>

        <!-- PARA QUEM É -->
        <div id="app-who" class="w-full"></div>

        <!-- FAQ (NOVO) -->
        <div id="app-faq" class="w-full"></div>
      </main>

      <!-- FOOTER (full-bleed, sem max-width no wrapper) -->
      <footer class="da-site-footer da-site-footer--home w-full">
        <div class="da-footer-surface">
          <div id="app-footer" class="da-footer-inner"></div>
        </div>
      </footer>
    </div>

  </body>
</html>
