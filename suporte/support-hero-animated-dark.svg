<svg width="900" height="620" viewBox="0 0 900 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Central de suporte DermAlert em modo escuro</title>
  <desc id="desc">Bussola escura de suporte com acesso, privacidade, documentacao e contato conectados.</desc>
  <defs>
    <linearGradient id="bg" x1="82" y1="64" x2="830" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#162842"/>
      <stop offset=".58" stop-color="#0E1A2B"/>
      <stop offset="1" stop-color="#132746"/>
    </linearGradient>
    <linearGradient id="navy" x1="178" y1="108" x2="720" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8ED7EA"/>
      <stop offset="1" stop-color="#4DAA86"/>
    </linearGradient>
    <filter id="shadow" x="24" y="26" width="840" height="548" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000000" flood-opacity=".36"/>
    </filter>
    <style>
      .ring{stroke-dasharray:12 18;animation:ring 18s linear infinite}
      .float{animation:float 5.8s ease-in-out infinite;transform-origin:center}
      .f2{animation-delay:.8s}.f3{animation-delay:1.6s}.f4{animation-delay:2.4s}
      @keyframes ring{to{stroke-dashoffset:-320}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      @media (prefers-reduced-motion:reduce){.ring,.float{animation:none}}
    </style>
  </defs>

  <rect x="54" y="46" width="792" height="528" rx="38" fill="url(#bg)" filter="url(#shadow)"/>
  <path d="M112 128h676M112 220h676M112 312h676M112 404h676M112 496h676M200 88v428M288 88v428M376 88v428M464 88v428M552 88v428M640 88v428M728 88v428" stroke="#8ED7EA" stroke-opacity=".07"/>

  <circle cx="730" cy="142" r="72" fill="#8ED7EA" opacity=".11"/>
  <circle cx="170" cy="452" r="74" fill="#D06A32" opacity=".11"/>
  <circle cx="178" cy="150" r="22" fill="#F0A06D" opacity=".16"/>

  <circle cx="450" cy="310" r="166" fill="#162842" stroke="#8ED7EA" stroke-opacity=".18"/>
  <circle cx="450" cy="310" r="116" fill="#203B59"/>
  <path class="ring" d="M450 138a172 172 0 1 1 0 344a172 172 0 0 1 0-344Z" stroke="#8ED7EA" stroke-width="6" stroke-linecap="round"/>
  <path d="M450 208 514 336l-64-28-64 28 64-128Z" fill="url(#navy)"/>
  <circle cx="450" cy="310" r="22" fill="#D06A32" stroke="#0E1A2B" stroke-width="7"/>

  <g class="float">
    <circle cx="238" cy="190" r="54" fill="#1D366F"/>
    <path d="M222 190h32m-16-16v32" stroke="#8ED7EA" stroke-width="7" stroke-linecap="round"/>
    <text x="238" y="264" text-anchor="middle" fill="white" font-family="Lexend, Arial, sans-serif" font-size="16" font-weight="900">Acesso</text>
  </g>
  <g class="float f2">
    <circle cx="662" cy="210" r="54" fill="#D06A32"/>
    <path d="M662 178 696 194v28c0 34-22 54-34 62-12-8-34-28-34-62v-28l34-16Z" fill="#162842"/>
    <path d="m648 226 10 10 22-30" stroke="#F0A06D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="662" y="286" text-anchor="middle" fill="white" font-family="Lexend, Arial, sans-serif" font-size="16" font-weight="900">Privacidade</text>
  </g>
  <g class="float f3">
    <circle cx="636" cy="438" r="54" fill="#2D7E99"/>
    <path d="M612 420h48M612 444h34" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <path d="M672 408v52" stroke="#8ED7EA" stroke-width="6" stroke-linecap="round"/>
    <text x="636" y="512" text-anchor="middle" fill="white" font-family="Lexend, Arial, sans-serif" font-size="16" font-weight="900">Documentos</text>
  </g>
  <g class="float f4">
    <circle cx="250" cy="424" r="54" fill="#4DAA86"/>
    <path d="M220 410h60v38h-60z" fill="#203B59"/>
    <path d="m220 412 30 22 30-22" stroke="#8ED7EA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="250" y="498" text-anchor="middle" fill="white" font-family="Lexend, Arial, sans-serif" font-size="16" font-weight="900">Contato</text>
  </g>

  <path d="M288 206 390 272M612 230 510 276M598 414 508 352M294 408 390 350" stroke="#8ED7EA" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12" opacity=".7"/>
</svg>
