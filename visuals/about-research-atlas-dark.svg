<svg width="880" height="560" viewBox="0 0 880 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Atlas visual do projeto DermAlert em modo escuro</title>
  <desc id="desc">Composicao escura organizada com pesquisa, triagem, LGPD, rede de cuidado e data fabric.</desc>
  <defs>
    <linearGradient id="paper" x1="70" y1="40" x2="820" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172A45"/>
      <stop offset=".58" stop-color="#0E1A2B"/>
      <stop offset="1" stop-color="#132746"/>
    </linearGradient>
    <linearGradient id="navy" x1="300" y1="160" x2="586" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24488F"/>
      <stop offset="1" stop-color="#2D7E99"/>
    </linearGradient>
    <filter id="shadow" x="30" y="20" width="820" height="540" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#000000" flood-opacity=".34"/>
    </filter>
    <style>
      .dash{stroke-dasharray:8 13;animation:dash 16s linear infinite}
      .float{animation:float 6.2s ease-in-out infinite;transform-origin:center}
      .f2{animation-delay:.9s}.f3{animation-delay:1.7s}
      .bar{animation:bar 4.4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
      @keyframes dash{to{stroke-dashoffset:-180}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes bar{0%,100%{transform:scaleX(.5)}50%{transform:scaleX(1)}}
      @media (prefers-reduced-motion:reduce){.dash,.float,.bar{animation:none}}
    </style>
  </defs>

  <rect x="42" y="38" width="796" height="484" rx="32" fill="url(#paper)" filter="url(#shadow)"/>
  <path d="M78 112h724M78 184h724M78 256h724M78 328h724M78 400h724M78 472h724M158 76v412M238 76v412M318 76v412M398 76v412M478 76v412M558 76v412M638 76v412M718 76v412" stroke="#8ED7EA" stroke-opacity=".06"/>
  <circle cx="730" cy="116" r="58" fill="#8ED7EA" opacity=".1"/>
  <circle cx="150" cy="434" r="62" fill="#D06A32" opacity=".12"/>
  <circle cx="178" cy="424" r="18" fill="#F0A06D" opacity=".18"/>

  <path class="dash" d="M250 198H334" stroke="#8ED7EA" stroke-width="5" stroke-linecap="round"/>
  <path class="dash" d="M546 198H630" stroke="#D06A32" stroke-width="5" stroke-linecap="round"/>
  <path class="dash" d="M394 334V382H266" stroke="#4DAA86" stroke-width="5" stroke-linecap="round"/>
  <path class="dash" d="M486 334V382H616" stroke="#8ED7EA" stroke-width="5" stroke-linecap="round"/>

  <g transform="translate(334 148)">
    <rect width="212" height="186" rx="28" fill="#162842" stroke="#8ED7EA" stroke-opacity=".2" stroke-width="3"/>
    <circle cx="106" cy="93" r="68" fill="#203B59"/>
    <circle cx="106" cy="93" r="42" fill="none" stroke="#D06A32" stroke-width="3" opacity=".65"/>
    <circle cx="106" cy="93" r="15" fill="#8ED7EA"/>
    <path d="M58 62h96M58 126h96" stroke="#314A6D" stroke-width="7" stroke-linecap="round"/>
    <text x="106" y="168" text-anchor="middle" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="14" font-weight="900">base integrada</text>
  </g>

  <g class="float">
    <rect x="88" y="154" width="162" height="92" rx="16" fill="#1D366F" stroke="#8ED7EA" stroke-opacity=".14"/>
    <text x="116" y="188" fill="#8ED7EA" font-family="Lexend, Arial, sans-serif" font-size="13" font-weight="900">APS</text>
    <text x="116" y="214" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="19" font-weight="900">Triagem</text>
    <path class="bar" d="M116 230h82" stroke="#8ED7EA" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g class="float f2">
    <rect x="630" y="154" width="162" height="92" rx="16" fill="#162842" stroke="#8ED7EA" stroke-opacity=".18"/>
    <path d="M666 174 694 188v22c0 28-18 44-28 50-10-6-28-22-28-50v-22l28-14Z" fill="#203B59" stroke="#8ED7EA" stroke-width="3"/>
    <path d="m654 210 8 8 18-23" stroke="#8ED7EA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="716" y="188" fill="#F0A06D" font-family="Lexend, Arial, sans-serif" font-size="13" font-weight="900">LGPD</text>
    <text x="716" y="214" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="18" font-weight="900">Dados</text>
  </g>

  <g class="float f3">
    <rect x="120" y="350" width="180" height="92" rx="16" fill="#162842" stroke="#8ED7EA" stroke-opacity=".18"/>
    <text x="148" y="383" fill="#F0A06D" font-family="Lexend, Arial, sans-serif" font-size="13" font-weight="900">PESQUISA</text>
    <text x="148" y="409" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="18" font-weight="900">Data fabric</text>
    <path d="M148 426h100" stroke="#314A6D" stroke-width="7" stroke-linecap="round"/>
    <path class="bar" d="M148 426h100" stroke="#D06A32" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g class="float f2">
    <rect x="580" y="350" width="206" height="92" rx="16" fill="#1D366F" stroke="#8ED7EA" stroke-opacity=".14"/>
    <text x="608" y="383" fill="#8ED7EA" font-family="Lexend, Arial, sans-serif" font-size="13" font-weight="900">ENCAMINHAMENTO</text>
    <text x="608" y="409" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="18" font-weight="900">Rede de cuidado</text>
    <path d="M608 426h110" stroke="#8ED7EA" stroke-width="7" stroke-linecap="round"/>
    <path class="bar" d="M608 426h110" stroke="#D06A32" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(360 386)">
    <rect width="160" height="58" rx="18" fill="url(#navy)"/>
    <circle cx="34" cy="29" r="12" fill="#8ED7EA"/>
    <text x="58" y="25" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="12" font-weight="900">DERM</text>
    <text x="58" y="42" fill="#8ED7EA" font-family="Lexend, Arial, sans-serif" font-size="12" font-weight="900">ALERT</text>
    <text x="112" y="34" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="12" font-weight="800">pesquisa</text>
  </g>
</svg>
