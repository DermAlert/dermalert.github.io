<svg width="920" height="430" viewBox="0 0 920 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Estrategia de cuidado e pesquisa DermAlert em modo escuro</title>
  <desc id="desc">Fluxo visual escuro com educacao, sinais clinicos, dados e IA, rede assistencial, APS e LGPD.</desc>
  <defs>
    <linearGradient id="primaryCard" x1="320" y1="38" x2="604" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#284E9B"/>
      <stop offset="1" stop-color="#1D366F"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      .card{animation:lift 7s ease-in-out infinite;transform-origin:center}
      .d2{animation-delay:.8s}.d3{animation-delay:1.4s}
      .dash{stroke-dasharray:6 12;animation:dash 18s linear infinite}
      .pulse{animation:pulse 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes dash{to{stroke-dashoffset:-180}}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.72}}
      @media (prefers-reduced-motion:reduce){.card,.dash,.pulse{animation:none}}
    </style>
  </defs>

  <circle cx="148" cy="96" r="52" fill="#D06A32" opacity=".11"/>
  <circle cx="744" cy="332" r="62" fill="#8ED7EA" opacity=".09"/>
  <circle cx="754" cy="92" r="18" fill="#F0A06D" opacity=".16"/>

  <path class="dash" d="M288 108H320" stroke="#8ED7EA" stroke-width="4" stroke-linecap="round"/>
  <path class="dash" d="M600 108H632" stroke="#D06A32" stroke-width="4" stroke-linecap="round"/>
  <path class="dash" d="M460 160V202" stroke="#8ED7EA" stroke-width="4" stroke-linecap="round"/>
  <path class="dash" d="M420 244H292V292" stroke="#2D7E99" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="dash" d="M500 244H628V292" stroke="#4DAA86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g class="card" filter="url(#cardShadow)">
    <rect x="78" y="66" width="210" height="84" rx="18" fill="#162842" stroke="#8ED7EA" stroke-opacity=".28"/>
    <circle cx="112" cy="108" r="22" fill="#D06A32" opacity=".16"/>
    <path d="M103 108h18M112 99v18" stroke="#F0A06D" stroke-width="5" stroke-linecap="round"/>
    <text x="148" y="94" fill="#F0A06D" font-family="Lexend, Arial, sans-serif" font-size="10" font-weight="900">01 BASE</text>
    <text x="148" y="118" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="18" font-weight="900">Educa&#231;&#227;o</text>
    <text x="148" y="139" fill="#AFC2D8" font-family="Lexend, Arial, sans-serif" font-size="10" font-weight="700">orienta&#231;&#227;o e acesso</text>
  </g>

  <g class="card d2" filter="url(#cardShadow)">
    <rect x="320" y="40" width="280" height="120" rx="22" fill="url(#primaryCard)" stroke="#8ED7EA" stroke-opacity=".12"/>
    <text x="356" y="76" fill="#8ED7EA" font-family="Lexend, Arial, sans-serif" font-size="11" font-weight="900">02 DETEC&#199;&#195;O</text>
    <text x="356" y="105" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="22" font-weight="900">Sinais cl&#237;nicos</text>
    <circle cx="362" cy="132" r="22" fill="#D06A32" opacity=".2"/>
    <circle class="pulse" cx="362" cy="132" r="11" fill="#D06A32"/>
    <path d="M410 126h78M410 146h54" stroke="#8ED7EA" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g class="card d3" filter="url(#cardShadow)">
    <rect x="632" y="66" width="226" height="84" rx="18" fill="#162842" stroke="#8ED7EA" stroke-opacity=".28"/>
    <text x="662" y="94" fill="#F0A06D" font-family="Lexend, Arial, sans-serif" font-size="10" font-weight="900">03 DADOS</text>
    <text x="662" y="118" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="18" font-weight="900">Dados e IA</text>
    <text x="662" y="139" fill="#AFC2D8" font-family="Lexend, Arial, sans-serif" font-size="10" font-weight="700">apoio &#224; decis&#227;o</text>
    <g transform="translate(780 96)">
      <path d="M0 24 25 6 54 26" stroke="#8ED7EA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="24" r="6" fill="#8ED7EA"/>
      <circle cx="25" cy="6" r="6" fill="#D06A32"/>
      <circle cx="54" cy="26" r="6" fill="#4DAA86"/>
    </g>
  </g>

  <g transform="translate(412 192)" filter="url(#cardShadow)">
    <rect width="96" height="96" rx="28" fill="#203B59" stroke="#8ED7EA" stroke-opacity=".55"/>
    <path d="M48 13 74 27v20c0 25-16 39-26 45-10-6-26-20-26-45V27l26-14Z" fill="#1D366F" stroke="#8ED7EA" stroke-opacity=".3"/>
    <path d="m36 50 9 9 20-25" stroke="#8ED7EA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="27" y="68" width="42" height="17" rx="8.5" fill="#0E1A2B" stroke="#8ED7EA" stroke-opacity=".75"/>
    <text x="48" y="81" fill="#8ED7EA" font-family="Lexend, Arial, sans-serif" font-size="12" font-weight="900" text-anchor="middle">LGPD</text>
  </g>

  <g class="card d2" filter="url(#cardShadow)">
    <rect x="132" y="292" width="288" height="88" rx="18" fill="#162842" stroke="#8ED7EA" stroke-opacity=".28"/>
    <text x="162" y="321" fill="#F0A06D" font-family="Lexend, Arial, sans-serif" font-size="10" font-weight="900">04 REDE</text>
    <text x="162" y="347" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="19" font-weight="900">Rede assistencial</text>
    <text x="162" y="368" fill="#AFC2D8" font-family="Lexend, Arial, sans-serif" font-size="10" font-weight="700">fluxo organizado de cuidado</text>
    <path d="M360 322h36M360 342h26" stroke="#8ED7EA" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g class="card" filter="url(#cardShadow)">
    <rect x="500" y="292" width="298" height="88" rx="18" fill="#162842" stroke="#8ED7EA" stroke-opacity=".28"/>
    <text x="530" y="321" fill="#F0A06D" font-family="Lexend, Arial, sans-serif" font-size="10" font-weight="900">05 IMPACTO</text>
    <text x="530" y="347" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="19" font-weight="900">APS priorizada</text>
    <text x="530" y="368" fill="#AFC2D8" font-family="Lexend, Arial, sans-serif" font-size="10" font-weight="700">rastreabilidade territorial</text>
    <circle cx="738" cy="336" r="25" fill="#203B59"/>
    <circle cx="738" cy="336" r="12" fill="#8ED7EA"/>
    <circle class="pulse" cx="738" cy="336" r="6" fill="#D06A32"/>
  </g>
</svg>
