<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">DermAlert course animated learning path illustration</title>
  <desc id="desc">Animated learning pathway for dermatology triage training with modules, progress and clinical workflow elements.</desc>
  <defs>
    <linearGradient id="courseBg" x1="108" x2="852" y1="58" y2="666" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset=".52" stop-color="#E9F7FB"/>
      <stop offset="1" stop-color="#FFF4ED"/>
    </linearGradient>
    <linearGradient id="coursePanel" x1="174" x2="790" y1="122" y2="604" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8FC"/>
    </linearGradient>
    <linearGradient id="courseAccent" x1="250" x2="710" y1="178" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B7561F"/>
      <stop offset=".48" stop-color="#2D7E99"/>
      <stop offset="1" stop-color="#1D366F"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1D366F" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1D366F" flood-opacity="0.12"/>
    </filter>
    <style>
      .float-a { animation: floatA 6.5s ease-in-out infinite; transform-origin: center; }
      .float-b { animation: floatB 7.2s ease-in-out infinite; transform-origin: center; }
      .float-c { animation: floatC 5.4s ease-in-out infinite; transform-origin: center; }
      .progress { stroke-dasharray: 740; stroke-dashoffset: 740; animation: progress 7.6s ease-in-out infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
      .pulse-delay { animation: pulse 2.6s ease-in-out infinite .9s; transform-origin: center; }
      .spark { animation: spark 4.2s ease-in-out infinite; transform-origin: center; }
      .line-move { stroke-dasharray: 10 18; animation: dash 13s linear infinite; }
      .bar-one { animation: growOne 4.8s ease-in-out infinite; transform-origin: left center; }
      .bar-two { animation: growTwo 4.8s ease-in-out infinite; transform-origin: left center; }
      .bar-three { animation: growThree 4.8s ease-in-out infinite; transform-origin: left center; }
      @keyframes floatA {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translateY(0) translateX(0); }
        50% { transform: translateY(12px) translateX(8px); }
      }
      @keyframes floatC {
        0%, 100% { transform: translateY(0) translateX(0); }
        50% { transform: translateY(-10px) translateX(-8px); }
      }
      @keyframes progress {
        0%, 12% { stroke-dashoffset: 740; opacity: .22; }
        54%, 78% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -740; opacity: .22; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: .86; }
        50% { transform: scale(1.09); opacity: 1; }
      }
      @keyframes spark {
        0%, 100% { transform: scale(.85) rotate(0deg); opacity: .35; }
        45% { transform: scale(1.15) rotate(16deg); opacity: 1; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -260; }
      }
      @keyframes growOne {
        0%, 100% { transform: scaleX(.55); }
        50% { transform: scaleX(1); }
      }
      @keyframes growTwo {
        0%, 100% { transform: scaleX(.42); }
        50% { transform: scaleX(.82); }
      }
      @keyframes growThree {
        0%, 100% { transform: scaleX(.62); }
        50% { transform: scaleX(.94); }
      }
      @media (prefers-reduced-motion: reduce) {
        .float-a, .float-b, .float-c, .progress, .pulse, .pulse-delay, .spark, .line-move, .bar-one, .bar-two, .bar-three {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="960" height="720" rx="36" fill="url(#courseBg)"/>
  <circle cx="134" cy="122" r="76" fill="#FFEFE5"/>
  <circle cx="820" cy="592" r="102" fill="#D6F2FA"/>
  <path class="line-move" d="M128 470 C248 354 320 552 452 412 S644 224 828 318" fill="none" stroke="#2D7E99" stroke-width="3" opacity=".24"/>
  <path class="line-move" d="M136 256 C280 176 356 300 494 254 S650 132 812 204" fill="none" stroke="#B7561F" stroke-width="3" opacity=".26"/>

  <g filter="url(#softShadow)">
    <rect x="160" y="104" width="640" height="500" rx="36" fill="url(#coursePanel)"/>
    <rect x="160" y="104" width="640" height="78" rx="36" fill="#1D366F"/>
    <rect x="160" y="146" width="640" height="36" fill="#1D366F"/>
    <circle cx="210" cy="143" r="9" fill="#FFEFE5"/>
    <circle cx="240" cy="143" r="9" fill="#D6F2FA"/>
    <circle cx="270" cy="143" r="9" fill="#B7561F"/>
    <rect x="324" y="130" width="188" height="26" rx="13" fill="#FFFFFF" opacity=".14"/>
    <rect x="536" y="130" width="156" height="26" rx="13" fill="#FFFFFF" opacity=".10"/>
  </g>

  <path d="M266 486 C316 398 376 438 414 352 C454 264 532 308 574 230 C616 154 692 222 724 168" fill="none" stroke="#DDE7F1" stroke-width="18" stroke-linecap="round"/>
  <path class="progress" d="M266 486 C316 398 376 438 414 352 C454 264 532 308 574 230 C616 154 692 222 724 168" fill="none" stroke="url(#courseAccent)" stroke-width="10" stroke-linecap="round"/>

  <g filter="url(#cardShadow)">
    <g class="float-a">
      <rect x="218" y="406" width="156" height="118" rx="24" fill="#FFFFFF"/>
      <circle class="pulse" cx="254" cy="442" r="20" fill="#B7561F"/>
      <rect x="290" y="426" width="56" height="10" rx="5" fill="#1D366F" opacity=".3"/>
      <rect x="250" y="472" width="92" height="10" rx="5" fill="#DDE7F1"/>
      <rect x="250" y="492" width="66" height="10" rx="5" fill="#DDE7F1"/>
    </g>

    <g class="float-c">
      <rect x="350" y="292" width="174" height="128" rx="24" fill="#FFFFFF"/>
      <circle class="pulse-delay" cx="390" cy="330" r="20" fill="#2D7E99"/>
      <rect x="426" y="314" width="64" height="10" rx="5" fill="#1D366F" opacity=".3"/>
      <rect class="bar-one" x="390" y="360" width="98" height="10" rx="5" fill="#B7561F" opacity=".55"/>
      <rect class="bar-two" x="390" y="382" width="98" height="10" rx="5" fill="#2D7E99" opacity=".45"/>
    </g>

    <g class="float-b">
      <rect x="548" y="166" width="176" height="132" rx="24" fill="#FFFFFF"/>
      <circle class="pulse" cx="588" cy="204" r="20" fill="#1D366F"/>
      <rect x="624" y="188" width="62" height="10" rx="5" fill="#1D366F" opacity=".3"/>
      <rect x="588" y="238" width="94" height="10" rx="5" fill="#DDE7F1"/>
      <rect x="588" y="260" width="70" height="10" rx="5" fill="#DDE7F1"/>
    </g>
  </g>

  <g class="float-b" filter="url(#cardShadow)">
    <rect x="594" y="366" width="190" height="160" rx="28" fill="#FFFFFF"/>
    <rect x="622" y="394" width="82" height="14" rx="7" fill="#1D366F" opacity=".28"/>
    <rect x="622" y="428" width="118" height="12" rx="6" fill="#DDE7F1"/>
    <rect x="622" y="452" width="92" height="12" rx="6" fill="#DDE7F1"/>
    <g transform="translate(628 482)">
      <rect width="122" height="20" rx="10" fill="#E7F5FA"/>
      <rect class="bar-three" width="96" height="20" rx="10" fill="#2D7E99" opacity=".75"/>
    </g>
  </g>

  <g class="float-c" filter="url(#cardShadow)">
    <rect x="176" y="202" width="138" height="138" rx="28" fill="#FFFFFF"/>
    <path d="M244 228 286 246v32c0 34-22 56-42 64-20-8-42-30-42-64v-32l42-18Z" fill="#1D366F"/>
    <path d="M222 280h44M244 258v44" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g class="spark">
    <path d="M778 188 788 210 812 220 790 230 780 254 770 232 746 222 768 212Z" fill="#B7561F" opacity=".75"/>
  </g>
  <g class="spark" style="animation-delay: 1.1s">
    <path d="M164 548 172 566 192 574 174 582 166 602 158 584 138 576 156 568Z" fill="#2D7E99" opacity=".72"/>
  </g>
  <g class="spark" style="animation-delay: 1.8s">
    <path d="M472 594 480 612 500 620 482 628 474 648 466 630 446 622 464 614Z" fill="#1D366F" opacity=".55"/>
  </g>

  <circle class="pulse" cx="266" cy="486" r="9" fill="#B7561F"/>
  <circle class="pulse-delay" cx="414" cy="352" r="9" fill="#2D7E99"/>
  <circle class="pulse" cx="574" cy="230" r="9" fill="#1D366F"/>
  <circle class="pulse-delay" cx="724" cy="168" r="9" fill="#B7561F"/>
</svg>
