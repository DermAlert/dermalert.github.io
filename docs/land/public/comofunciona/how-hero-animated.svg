<svg width="760" height="560" viewBox="0 0 760 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo DermAlert animado</title>
  <desc id="desc">Ilustracao de um fluxo de triagem com cards, celular e indicadores clinicos.</desc>
  <style>
    .float{animation:float 5.8s ease-in-out infinite}
    .float2{animation:float 6.8s ease-in-out infinite reverse}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    .scan{animation:scan 4.8s ease-in-out infinite}
    .dash{stroke-dasharray:9 12;animation:dash 11s linear infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes pulse{0%,100%{opacity:.45;transform:scale(.94);transform-origin:center}50%{opacity:1;transform:scale(1.05);transform-origin:center}}
    @keyframes scan{0%{transform:translateX(-250px);opacity:0}18%,78%{opacity:1}100%{transform:translateX(250px);opacity:0}}
    @keyframes dash{to{stroke-dashoffset:-210}}
  </style>
  <rect width="760" height="560" rx="32" fill="#F8FBFF"/>
  <path d="M0 0H760V560H0V0Z" fill="url(#grid)"/>
  <circle cx="92" cy="82" r="54" fill="#FFF0E6"/>
  <circle cx="650" cy="456" r="70" fill="#D9F5FB"/>
  <circle cx="604" cy="108" r="14" fill="#D06A32" opacity=".85"/>
  <circle cx="106" cy="438" r="11" fill="#2D7E99" opacity=".75"/>

  <g filter="url(#shadow)" class="float">
    <rect x="126" y="112" width="500" height="322" rx="28" fill="white"/>
    <rect x="126" y="112" width="500" height="70" rx="28" fill="#1D366F"/>
    <circle cx="166" cy="147" r="9" fill="#FFEFE5"/>
    <circle cx="194" cy="147" r="9" fill="#8ED7EA"/>
    <circle cx="222" cy="147" r="9" fill="#D06A32"/>
    <rect x="268" y="136" width="126" height="18" rx="9" fill="white" opacity=".18"/>
    <rect x="420" y="136" width="146" height="18" rx="9" fill="white" opacity=".14"/>

    <path class="dash" d="M213 278C282 230 326 333 397 278C468 222 519 262 559 214" stroke="#8ED7EA" stroke-width="8" stroke-linecap="round"/>

    <g filter="url(#soft)">
      <rect x="166" y="210" width="124" height="92" rx="18" fill="#FFFFFF"/>
      <rect x="188" y="232" width="58" height="10" rx="5" fill="#CAD7E5"/>
      <rect x="188" y="256" width="78" height="10" rx="5" fill="#DEE8F2"/>
      <circle cx="198" cy="284" r="12" fill="#D06A32"/>
      <rect x="220" y="279" width="42" height="9" rx="4.5" fill="#B8CADB"/>
    </g>

    <g filter="url(#soft)" class="float2">
      <rect x="316" y="246" width="150" height="96" rx="18" fill="#FFFFFF"/>
      <circle class="pulse" cx="344" cy="276" r="20" fill="#2D7E99"/>
      <rect x="376" y="266" width="58" height="10" rx="5" fill="#CAD7E5"/>
      <rect x="376" y="291" width="72" height="10" rx="5" fill="#DEE8F2"/>
      <rect x="340" y="318" width="92" height="12" rx="6" fill="#8ED7EA"/>
    </g>

    <g filter="url(#soft)">
      <rect x="486" y="202" width="104" height="112" rx="18" fill="#FFFFFF"/>
      <path d="M538 226L568 239V263C568 288 554 301 538 307C522 301 508 288 508 263V239L538 226Z" fill="#1D366F"/>
      <path d="M523 264L534 275L555 250" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g>
      <rect x="166" y="354" width="108" height="32" rx="9" fill="#EAF7FB"/>
      <rect x="292" y="354" width="108" height="32" rx="9" fill="#FFF0E6"/>
      <rect x="418" y="354" width="132" height="32" rx="9" fill="#EAF7EF"/>
    </g>

    <rect x="150" y="181" width="452" height="1.5" fill="#DDE7F1"/>
    <rect class="scan" x="318" y="181" width="170" height="1.5" fill="#8ED7EA"/>
  </g>

  <g filter="url(#shadow)" class="float2">
    <rect x="506" y="342" width="116" height="164" rx="24" fill="#FFFFFF"/>
    <rect x="518" y="362" width="92" height="124" rx="14" fill="#F7FAFC"/>
    <circle cx="564" cy="354" r="6" fill="#0E1A2B"/>
    <rect x="534" y="386" width="60" height="8" rx="4" fill="#CAD7E5"/>
    <rect x="534" y="410" width="44" height="8" rx="4" fill="#CAD7E5"/>
    <rect x="534" y="438" width="58" height="10" rx="5" fill="#1D366F"/>
    <rect x="534" y="458" width="38" height="8" rx="4" fill="#8ED7EA"/>
  </g>

  <g filter="url(#shadow)" class="float">
    <rect x="80" y="322" width="176" height="88" rx="18" fill="#1D366F"/>
    <text x="104" y="358" fill="white" font-family="Lexend, Arial" font-size="16" font-weight="700">Triagem guiada</text>
    <rect x="104" y="378" width="112" height="8" rx="4" fill="#8ED7EA"/>
    <rect x="104" y="392" width="88" height="8" rx="4" fill="white" opacity=".28"/>
  </g>

  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#1D366F" stroke-opacity=".06"/>
    </pattern>
    <filter id="shadow" x="40" y="70" width="620" height="470" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0E1A2B" flood-opacity=".18"/>
    </filter>
    <filter id="soft" x="130" y="175" width="500" height="200" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0E1A2B" flood-opacity=".12"/>
    </filter>
  </defs>
</svg>
