<svg width="760" height="560" viewBox="0 0 760 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rede de pesquisa DermAlert</title>
  <desc id="desc">Ilustracao animada de uma rede de pesquisa, clinica, dados e tecnologia.</desc>
  <style>
    .float{animation:float 6.4s ease-in-out infinite}
    .float2{animation:float 7s ease-in-out infinite reverse}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .dash{stroke-dasharray:7 12;animation:dash 10s linear infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes pulse{0%,100%{opacity:.45;transform:scale(.95);transform-origin:center}50%{opacity:1;transform:scale(1.06);transform-origin:center}}
    @keyframes dash{to{stroke-dashoffset:-190}}
  </style>
  <rect width="760" height="560" rx="32" fill="#F8FBFF"/>
  <path d="M0 0H760V560H0V0Z" fill="url(#grid)"/>
  <circle cx="102" cy="90" r="58" fill="#FFF0E6"/>
  <circle cx="654" cy="452" r="74" fill="#D9F5FB"/>

  <g filter="url(#shadow)" class="float">
    <rect x="126" y="112" width="508" height="324" rx="30" fill="#FFFFFF"/>
    <rect x="126" y="112" width="508" height="72" rx="30" fill="#1D366F"/>
    <circle cx="166" cy="148" r="9" fill="#FFEFE5"/>
    <circle cx="194" cy="148" r="9" fill="#8ED7EA"/>
    <circle cx="222" cy="148" r="9" fill="#D06A32"/>
    <rect x="280" y="138" width="164" height="18" rx="9" fill="white" opacity=".16"/>

    <path class="dash" d="M222 308L344 238L486 318M344 238L354 356M222 308L354 356M486 318L354 356" stroke="#8ED7EA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#soft)">
      <rect x="164" y="256" width="134" height="104" rx="20" fill="#FFFFFF"/>
      <circle cx="206" cy="298" r="22" fill="#FFF0E6"/>
      <path d="M205 282V314M189 298H221" stroke="#D06A32" stroke-width="8" stroke-linecap="round"/>
      <rect x="236" y="286" width="40" height="9" rx="4.5" fill="#CAD7E5"/>
      <rect x="236" y="309" width="32" height="9" rx="4.5" fill="#DDE7F1"/>
    </g>

    <g filter="url(#soft)" class="float2">
      <rect x="286" y="206" width="136" height="96" rx="20" fill="#FFFFFF"/>
      <rect x="316" y="236" width="76" height="12" rx="6" fill="#CAD7E5"/>
      <rect x="316" y="262" width="54" height="12" rx="6" fill="#8ED7EA"/>
      <circle class="pulse" cx="354" cy="222" r="11" fill="#1D366F"/>
    </g>

    <g filter="url(#soft)">
      <rect x="450" y="270" width="136" height="102" rx="20" fill="#FFFFFF"/>
      <path d="M518 292L552 306V330C552 356 535 370 518 376C501 370 484 356 484 330V306L518 292Z" fill="#1D366F"/>
      <path d="M502 330L514 342L536 316" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g filter="url(#soft)" class="float">
      <rect x="292" y="334" width="144" height="82" rx="20" fill="#FFFFFF"/>
      <rect x="320" y="358" width="90" height="10" rx="5" fill="#CAD7E5"/>
      <rect x="320" y="382" width="62" height="10" rx="5" fill="#DDE7F1"/>
      <rect x="396" y="378" width="18" height="18" rx="6" fill="#4DAA86"/>
    </g>
  </g>

  <g filter="url(#shadow)" class="float2">
    <rect x="90" y="388" width="198" height="86" rx="18" fill="#1D366F"/>
    <text x="116" y="423" fill="#FFFFFF" font-family="Lexend, Arial" font-size="16" font-weight="700">Pesquisa aplicada</text>
    <rect x="116" y="443" width="118" height="8" rx="4" fill="#8ED7EA"/>
    <rect x="116" y="457" width="92" height="8" rx="4" fill="white" opacity=".28"/>
  </g>

  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#1D366F" stroke-opacity=".06"/>
    </pattern>
    <filter id="shadow" x="45" y="70" width="640" height="450" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0E1A2B" flood-opacity=".18"/>
    </filter>
    <filter id="soft" x="130" y="180" width="500" height="270" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0E1A2B" flood-opacity=".11"/>
    </filter>
  </defs>
</svg>
