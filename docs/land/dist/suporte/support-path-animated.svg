<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">DermAlert support routing visual</title>
  <desc id="desc">Animated support map with access, privacy, documentation and workflow routes.</desc>
  <defs>
    <linearGradient id="supportBg" x1="70" x2="890" y1="40" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1A2B"/>
      <stop offset="1" stop-color="#1D366F"/>
    </linearGradient>
    <linearGradient id="supportLine" x1="182" x2="776" y1="286" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8ED7EA"/>
      <stop offset=".5" stop-color="#D06A32"/>
      <stop offset="1" stop-color="#79CFA5"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#06101F" flood-opacity=".28"/>
    </filter>
    <style>
      .panel{filter:url(#softShadow)}
      .route{fill:none;stroke:url(#supportLine);stroke-width:6;stroke-linecap:round;stroke-dasharray:18 22;animation:routeMove 6s linear infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite;transform-origin:center}
      .floatA{animation:floatA 5.5s ease-in-out infinite}
      .floatB{animation:floatB 6.5s ease-in-out infinite}
      .bar{animation:bar 4.8s ease-in-out infinite;transform-origin:left}
      @keyframes routeMove{to{stroke-dashoffset:-240}}
      @keyframes pulse{0%,100%{opacity:.48;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
      @keyframes bar{0%,100%{transform:scaleX(.42)}50%{transform:scaleX(1)}}
      @media (prefers-reduced-motion:reduce){.route,.pulse,.floatA,.floatB,.bar{animation:none}}
    </style>
  </defs>

  <rect width="960" height="560" rx="18" fill="url(#supportBg)"/>
  <path d="M72 92h816M72 468h816M112 58v444M848 58v444" stroke="#fff" stroke-opacity=".07"/>
  <path d="M188 286C286 190 373 190 470 286S660 382 776 286" class="route"/>

  <g class="panel floatA">
    <rect x="76" y="150" width="210" height="172" rx="8" fill="#fff"/>
    <rect x="102" y="178" width="48" height="48" rx="8" fill="#E9F7FB"/>
    <path d="M126 190v24M114 202h24" stroke="#1D366F" stroke-width="6" stroke-linecap="round"/>
    <rect x="166" y="182" width="84" height="12" rx="6" fill="#1D366F" opacity=".88"/>
    <rect x="166" y="206" width="64" height="8" rx="4" fill="#6E7F91" opacity=".38"/>
    <rect x="102" y="250" width="148" height="12" rx="6" fill="#D06A32" opacity=".9" class="bar"/>
    <rect x="102" y="278" width="120" height="8" rx="4" fill="#DDE7F1"/>
  </g>

  <g class="panel floatB">
    <rect x="374" y="108" width="216" height="204" rx="8" fill="#fff"/>
    <rect x="402" y="136" width="56" height="56" rx="8" fill="#FFF0E6"/>
    <path d="M430 150l18 8v16c0 18-18 26-18 26s-18-8-18-26v-16l18-8z" fill="none" stroke="#B7561F" stroke-width="5" stroke-linejoin="round"/>
    <rect x="476" y="142" width="78" height="12" rx="6" fill="#1D366F" opacity=".88"/>
    <rect x="476" y="166" width="54" height="8" rx="4" fill="#6E7F91" opacity=".38"/>
    <rect x="402" y="224" width="152" height="12" rx="6" fill="#79CFA5" opacity=".95" class="bar"/>
    <rect x="402" y="254" width="118" height="8" rx="4" fill="#DDE7F1"/>
  </g>

  <g class="panel floatA">
    <rect x="680" y="168" width="204" height="184" rx="8" fill="#fff"/>
    <rect x="708" y="198" width="46" height="46" rx="8" fill="#E8EEF9"/>
    <path d="M721 214h26M721 226h22M721 238h16" stroke="#1D366F" stroke-width="5" stroke-linecap="round"/>
    <rect x="770" y="204" width="78" height="12" rx="6" fill="#1D366F" opacity=".88"/>
    <rect x="770" y="228" width="60" height="8" rx="4" fill="#6E7F91" opacity=".38"/>
    <rect x="708" y="278" width="144" height="12" rx="6" fill="#8ED7EA" opacity=".9" class="bar"/>
    <rect x="708" y="306" width="112" height="8" rx="4" fill="#DDE7F1"/>
  </g>

  <g class="pulse">
    <circle cx="181" cy="286" r="16" fill="#8ED7EA"/>
    <circle cx="181" cy="286" r="30" fill="none" stroke="#8ED7EA" stroke-opacity=".35" stroke-width="6"/>
  </g>
  <g class="pulse" style="animation-delay:.7s">
    <circle cx="480" cy="286" r="16" fill="#D06A32"/>
    <circle cx="480" cy="286" r="30" fill="none" stroke="#D06A32" stroke-opacity=".35" stroke-width="6"/>
  </g>
  <g class="pulse" style="animation-delay:1.4s">
    <circle cx="776" cy="286" r="16" fill="#79CFA5"/>
    <circle cx="776" cy="286" r="30" fill="none" stroke="#79CFA5" stroke-opacity=".35" stroke-width="6"/>
  </g>

  <rect x="312" y="396" width="336" height="70" rx="8" fill="#FFFFFF" opacity=".12"/>
  <path d="M352 431h256" stroke="#fff" stroke-opacity=".28" stroke-width="12" stroke-linecap="round"/>
  <path d="M352 431h168" stroke="#8ED7EA" stroke-width="12" stroke-linecap="round" class="bar"/>
</svg>
