<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dermalert</title>
    <meta name="description" content="Triagem dermatológica inteligente, simples e segura." />
    <meta name="theme-color" content="#094559" />
  </head>

  <body class="font-[Lexend] antialiased bg-white text-gray-800 dark:bg-[#0E1A2B] dark:text-gray-100">
    <a href="#conteudo"
       class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[100]
              focus:bg-white focus:text-gray-900 focus:px-4 focus:py-2 focus:rounded-lg focus:shadow">
      Pular para o conteúdo
    </a>

    <div class="min-h-screen flex flex-col items-center w-full bg-white dark:bg-[#0E1A2B]">
      <!-- HEADER (carregado via JS com /src/partials/globals/header.html) -->
      <div id="app-header" class="w-full"></div>

      <!-- MAIN -->
      <main id="conteudo" class="flex-1 w-full flex flex-col items-center">
        <!-- HERO (carregado via JS com /src/partials/home/hero.html) -->
        <div id="app-hero" class="w-full my-8"></div>

        <!-- FEATURES / PILLS (carregado via JS com /src/partials/home/features-pills.html) -->
        <div id="app-features-pills" class="w-full my-12"></div>
      </main>

      <!-- FOOTER (futuramente também pode ser partial) -->
      <footer class="w-full max-w-[1440px] px-4 sm:px-6 md:px-8 lg:px-[120px] py-8">
        <!-- Conteúdo do footer -->
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
