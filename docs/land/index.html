<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo.png" />

    <!-- Google Fonts: Lexend -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    >

    <!-- Google Fonts: Noto Sans -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dermalert</title>
    <meta name="description" content="Triagem dermatológica inteligente, simples e segura." />
    <meta name="theme-color" content="#1D366F" />
  </head>

  <body class="font-sans antialiased bg-white text-gray-800 dark:bg-[#0E1A2B] dark:text-gray-100">
    <a href="#conteudo"
       class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[100]
              focus:bg-white focus:text-gray-900 focus:px-4 focus:py-2 focus:rounded-lg focus:shadow">
      Pular para o conteúdo
    </a>

    <div class="min-h-screen flex flex-col items-center w-full bg-white dark:bg-[#0E1A2B]">
      <!-- MAIN -->
      <main id="conteudo" class="flex-1 w-full flex flex-col items-center">
        <div class="dermalert-hero-shell-home w-full">
          <!-- HEADER -->
          <div id="app-header" class="w-full"></div>

          <!-- HERO -->
          <div id="app-hero" class="w-full"></div>
        </div>

        <!-- FEATURES / PILLS -->
        <div id="app-features-pills" class="w-full -mt-8 md:-mt-10 relative z-10"></div>

        <!-- PARTNERS -->
        <div id="app-partners" class="w-full my-12"></div>

        <!-- FEATURES / BASE (↓ tirando margem inferior pra colar no about) -->
        <div id="app-features-base" class="w-full mt-12 mb-0"></div>

        <!-- SOBRE O DERMALERT (↓ sem margem superior extra) -->
        <div id="app-about" class="w-full mt-0"></div>

        <!-- PARA QUEM É -->
        <div id="app-who" class="w-full my-12"></div>

        <!-- FAQ (NOVO) -->
        <div id="app-faq" class="w-full mt-12 mb-0"></div>
      </main>

      <!-- FOOTER (full-bleed, sem max-width no wrapper) -->
      <footer class="w-full">
        <div class="w-full bg-[#1D366F]">
          <div id="app-footer" class="max-w-[1200px] mx-auto px-6 py-10 lg:py-12"></div>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
