<header class="w-full flex justify-center mt-4">
  <div class="w-full max-w-[1358px] flex items-center justify-between py-6 px-10 rounded-3xl
              border-b border-[#DEE5ED] bg-[#1D366F]
              shadow-[0_4px_6px_-1px_rgba(0,0,0,0.10),0_2px_4px_-1px_rgba(0,0,0,0.06)]
              dark:border-white/15 dark:bg-[#152A55]">

    <!-- Logo -->
    <a href="/" class="flex items-center gap-3">
      <img src="home/header/dermalert-logo-white.svg" alt="Dermalert" class="h-8 w-auto" />
      <span class="sr-only">Dermalert</span>
    </a>

    <!-- NAV DESKTOP -->
    <nav class="hidden lg:flex items-center gap-8 text-sm font-medium text-white/90" aria-label="Principal">
      <a href="#como-funciona" class="hover:text-white"><span data-i18n="como_funciona">Como funciona</span></a>
      <a href="#ajuda" class="hover:text-white"><span data-i18n="ajuda_e_suporte">Ajuda e Suporte</span></a>
      <a href="#curso" class="hover:text-white"><span data-i18n="curso_extensao">Curso de Extensão</span></a>
      <a href="#sobre" class="hover:text-white"><span data-i18n="sobre">Sobre</span></a>
      <a href="#docs" class="hover:text-white"><span data-i18n="documentacao">Documentação</span></a>

      <!-- Idioma (desktop) -->
      <label class="ml-4 inline-flex items-center gap-2 text-xs text-white/90">
        <span class="sr-only">Language</span>
        <select id="lang-select-desktop"
                class="rounded-md bg-white/10 hover:bg-white/15 border border-white/10 px-2 py-1 focus:outline-none">
          <option value="pt-BR">PT-BR</option>
          <option value="en">EN</option>
          <option value="es">ES</option>
        </select>
      </label>

      <!-- Toggle dark (desktop) — bounce + sombra -->
      <label class="inline-flex items-center gap-2 text-xs text-white/90">
        <input id="theme-toggle-desktop" type="checkbox" class="sr-only peer">
        <span
          class="relative inline-block h-5 w-9 rounded-full bg-white/20 transition
                 peer-checked:bg-white/40
                 after:content-[''] after:absolute after:left-0.5 after:top-0.5
                 after:h-4 after:w-4 after:rounded-full after:bg-white
                 after:shadow after:transition-transform after:duration-300 after:ease-out
                 peer-checked:after:translate-x-4 peer-checked:after:scale-110 peer-checked:after:shadow-md">
        </span>
        <span data-i18n="tema_escuro">Tema escuro</span>
      </label>
    </nav>

    <!-- Botão hambúrguer (mobile) -->
    <button id="nav-toggle"
            class="lg:hidden inline-flex items-center justify-center p-2 rounded-lg text-white/90
                   hover:bg-white/10 active:scale-[0.98] transition focus:outline-none
                   focus:ring-2 focus:ring-white/40"
            aria-controls="mobile-sheet" aria-expanded="false">
      <span class="sr-only">Abrir menu</span>
      <svg id="icon-open" class="h-6 w-6 transition-opacity duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <svg id="icon-close" class="h-6 w-6 opacity-0 pointer-events-none absolute" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- MOBILE: overlay + sheet -->
  <div id="mobile-overlay" class="lg:hidden fixed inset-0 z-40 hidden">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px] opacity-0 transition-opacity duration-200"></div>

    <div id="mobile-sheet"
         class="absolute left-4 right-4 top-[88px] rounded-2xl border border-white/10 bg-[#1D366F]
                shadow-[0_20px_60px_rgba(0,0,0,0.35)] translate-y-3 opacity-0 transition-all duration-200
                dark:bg-[#152A55] dark:border-white/15">
      <nav aria-label="Principal (mobile)" class="text-white/90">
        <ul class="py-2 text-base font-medium divide-y divide-white/10">
          <li>
            <a class="flex items-center gap-3 px-5 py-3 hover:bg-white/10 active:bg-white/15" href="#como-funciona">
              <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7h18M6 12h12M9 17h6"/></svg>
              <span class="flex-1" data-i18n="como_funciona">Como funciona</span>
              <span class="ml-2 inline-flex items-center rounded-full bg-white/15 px-2 py-0.5 text-xs" data-i18n="novo">Novo</span>
            </a>
          </li>

          <li>
            <button type="button"
                    class="w-full flex items-center gap-3 px-5 py-3 hover:bg-white/10 focus:outline-none"
                    data-accordion-trigger aria-expanded="false" aria-controls="ajuda-sub">
              <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span class="flex-1 text-left" data-i18n="ajuda_e_suporte">Ajuda e Suporte</span>
              <svg class="h-5 w-5 rotate-0 transition-transform duration-200" data-accordion-caret viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 9l6 6 6-6"/>
              </svg>
            </button>
            <div id="ajuda-sub" class="hidden" role="region">
              <ul class="pb-2">
                <li><a href="#acesso" class="block pl-14 pr-5 py-2.5 text-[15px] hover:bg-white/10" data-i18n="solicitar_acesso">Solicitar acesso</a></li>
                <li><a href="#remover-dados" class="block pl-14 pr-5 py-2.5 text-[15px] hover:bg-white/10" data-i18n="remover_dados">Remover dados</a></li>
                <li><a href="#faq" class="block pl-14 pr-5 py-2.5 text-[15px] hover:bg-white/10" data-i18n="faq">Perguntas frequentes</a></li>
              </ul>
            </div>
          </li>

          <li>
            <a class="flex items-center gap-3 px-5 py-3 hover:bg-white/10 active:bg-white/15" href="#curso">
              <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0v6"/></svg>
              <span class="flex-1" data-i18n="curso_extensao">Curso de Extensão</span>
            </a>
          </li>
          <li>
            <a class="flex items-center gap-3 px-5 py-3 hover:bg-white/10 active:bg-white/15" href="#sobre">
              <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-3-3h-2M7 20H2v-2a3 3 0 013-3h2m0-4a4 4 0 118 0 4 4 0 01-8 0z"/></svg>
              <span class="flex-1" data-i18n="sobre">Sobre</span>
            </a>
          </li>
          <li>
            <a class="flex items-center gap-3 px-5 py-3 hover:bg-white/10 active:bg-white/15" href="#docs">
              <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16h8M8 12h8m-6 8h6a2 2 0 002-2V6a2 2 0 00-2-2H9l-5 5v13a2 2 0 002 2h2"/></svg>
              <span class="flex-1" data-i18n="documentacao">Documentação</span>
            </a>
          </li>
        </ul>

        <!-- CTA -->
        <div class="px-5 pt-2 pb-3">
          <a href="#acesso" class="block text-center rounded-full bg-white text-[#1D366F] font-semibold py-3 shadow hover:shadow-md transition" data-i18n="solicitar_acesso">
            Solicitar acesso
          </a>
        </div>

        <!-- Rápido acesso -->
        <div class="px-5 pb-2 text-xs uppercase tracking-wide text-white/70" data-i18n="rapido_acesso">Rápido acesso</div>
        <div class="px-5 pb-3 grid grid-cols-2 gap-3">
          <a href="#status" class="rounded-xl bg-white/10 hover:bg-white/15 py-3 px-4 text-sm" data-i18n="status">Status</a>
          <a href="#lancamentos" class="rounded-xl bg-white/10 hover:bg-white/15 py-3 px-4 text-sm" data-i18n="lancamentos">Lançamentos</a>
        </div>

        <!-- Preferências -->
        <div class="px-5 py-3 border-t border-white/10 grid grid-cols-2 items-center gap-4">
          <!-- Toggle dark (mobile) — bounce + sombra -->
          <label class="flex items-center gap-2 text-sm">
            <input id="theme-toggle" type="checkbox" class="peer sr-only">
            <span
              class="relative inline-block h-5 w-9 rounded-full bg-white/20 transition
                     peer-checked:bg-white/40
                     after:content-[''] after:absolute after:left-0.5 after:top-0.5
                     after:h-4 after:w-4 after:rounded-full after:bg-white
                     after:shadow after:transition-transform after:duration-300 after:ease-out
                     peer-checked:after:translate-x-4 peer-checked:after:scale-110 peer-checked:after:shadow-md">
            </span>
            <span data-i18n="tema_escuro">Tema escuro</span>
          </label>

          <!-- Idioma (mobile) -->
          <label class="text-sm">
            <span class="sr-only">Idioma</span>
            <select id="lang-select"
                    class="w-full rounded-lg bg-white/10 hover:bg-white/15 border border-white/10 px-3 py-2 text-sm focus:outline-none">
              <option value="pt-BR">Português (BR)</option>
              <option value="en">English</option>
              <option value="es">Español</option>
            </select>
          </label>
        </div>

        <!-- Social -->
        <div class="px-5 py-3 border-t border-white/10 flex items-center justify-between">
          <div class="flex items-center gap-4">
            <a href="https://github.com/DermAlert" target="_blank" aria-label="GitHub" class="hover:opacity-90">
              <svg class="h-5 w-5 fill-white" viewBox="0 0 24 24"><path d="M12 .5A12 12 0 0 0 8.2 23.9c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.3-1.8-1.3-1.8-1.1-.8.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.6 11.6 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.3.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5"/></svg>
            </a>
            <a href="https://instagram.com/DermAlert" target="_blank" aria-label="Instagram" class="hover:opacity-90">
              <svg class="h-5 w-5 fill-white" viewBox="0 0 448 512"><path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9S160.5 370.8 224.1 370.8 339 319.5 339 255.9 287.7 141 224.1 141zm146.4-26.3a26.9 26.9 0 1 0 0 53.8 26.9 26.9 0 0 0 0-53.8zM398.8 388c-7.8 19.6-22.9 34.7-42.5 42.5-29.4 11.7-99.2 9-132.3 9s-102.9 2.6-132.3-9c-19.6-7.8-34.7-22.9-42.5-42.5-11.7-29.4-9-99.2-9-132.3s-2.6-102.9 9-132.3c7.8-19.6 22.9-34.7 42.5-42.5 29.4-11.7 99.2-9 132.3-9s102.9-2.6 132.3 9c19.6 7.8 34.7 22.9 42.5 42.5 11.7 29.4 9 99.2 9 132.3s2.7 102.9-9 132.3z"/></svg>
            </a>
          </div>
          <span class="text-xs text-white/70">v1.0</span>
        </div>
      </nav>
    </div>
  </div>
</header>
