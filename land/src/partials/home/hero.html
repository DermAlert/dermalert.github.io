<!-- HERO (sem margens extras top/bottom) -->
<section id="hero" class="w-full my-0">
  <div
    class="relative w-full max-w-[1358px] mx-auto px-5 sm:px-6 lg:px-10
           overflow-hidden
           rounded-[16px] md:rounded-[20px] lg:rounded-[32px]
           bg-[#00377D]
           lg:bg-transparent
           lg:bg-[url('/home/hero/hero-bg.svg')]
           lg:bg-no-repeat lg:bg-center lg:bg-cover
           lg:h-[903px]">

    <div class="relative z-[1] w-full h-full grid grid-cols-12 items-center">
      <div class="hidden lg:block col-span-5"></div>

      <!-- bloco de textos -->
      <div class="col-span-12 lg:col-span-7">
        <div class="mx-auto flex flex-col items-center text-white
                    pt-6 sm:pt-8 lg:pt-0
                    lg:px-0 lg:translate-x-[40px]">

          <!-- título -->
          <h1 id="hero-title"
              data-i18n="hero_title"
              class="w-full lg:w-[730px] max-w-[730px]
                     text-center font-bold tracking-tight
                     text-[22px] leading-[30px]
                     sm:text-[26px] sm:leading-[34px]
                     lg:text-[48px] lg:leading-tight">
            Triagem dermatológica inteligente, simples e segura.
          </h1>

          <!-- subtítulo -->
          <p id="hero-sub"
             data-i18n="hero_sub"
             class="mt-3 sm:mt-4 lg:mt-[42px]
                    w-full max-w-[320px] sm:max-w-[420px] lg:max-w-[694px]
                    text-center
                    text-[14px] leading-[22px]
                    sm:text-[16px] sm:leading-[24px]
                    lg:text-[24px] lg:leading-snug">
            Registre paciente, conduza anamnese e organize dados para decisões clínicas e pesquisa.
          </p>

          <!-- BOTÕES (com efeito de preenchimento no hover) -->
          <div class="mt-6 sm:mt-6 lg:mt-[42px]
                      flex flex-col sm:flex-row items-center justify-center
                      gap-4 sm:gap-5 lg:gap-[64px]">

            <!-- CTA 1 -->
            <a href="#acesso"
               class="group relative overflow-hidden
                      inline-flex items-center justify-center
                      w-full max-w-[280px] sm:w-[240px]
                      h-[52px] sm:h-[56px]
                      px-6
                      rounded-[30px] sm:rounded-[50px]
                      text-[16px] sm:text-base font-semibold
                      text-white bg-[#E8611D]
                      shadow-[0_8px_24px_rgba(0,0,0,0.18)]
                      transition-colors duration-300">
              <!-- camada animada -->
              <span class="pointer-events-none absolute inset-0 w-0 bg-[#F57F0A] rounded-[inherit]
                           transition-all duration-500 ease-out group-hover:w-full"></span>
              <!-- texto (alvo do i18n) -->
              <span class="relative z-10" data-i18n="hero_cta_acesso">Solicitar Acesso</span>
            </a>

            <!-- CTA 2 -->
            <a href="#sobre"
               class="group relative overflow-hidden
                      inline-flex items-center justify-center
                      w-full max-w-[280px] sm:w-[240px]
                      h-[52px] sm:h-[56px]
                      px-6
                      rounded-[30px] sm:rounded-[50px]
                      text-[16px] sm:text-base font-semibold
                      border-2 sm:border-[4px] border-white
                      text-white transition-colors duration-300">
              <!-- camada animada -->
              <span class="pointer-events-none absolute inset-0 w-0 bg-white/20 rounded-[inherit]
                           transition-all duration-500 ease-out group-hover:w-full"></span>
              <!-- texto (alvo do i18n) -->
              <span class="relative z-10" data-i18n="hero_cta_sobre">Sobre o Projeto</span>
            </a>

          </div>
        </div>
      </div>
    </div>
    <!-- /conteúdo -->
  </div>
</section>
