<!-- PARTNERS / APOIO E INICIATIVA -->
<section id="partners" class="w-full my-8">
  <div class="w-full max-w-[1358px] mx-auto px-5 sm:px-6 lg:px-10">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      
      <!-- BLOCO INICIATIVA -->
      <div class="relative rounded-2xl border-2 border-[#E8611D] px-8 py-10 flex flex-col items-center">
        <!-- título embutido na borda -->
        <span data-i18n="partners_initiative"
              class="absolute -top-3 bg-white dark:bg-[#0E1A2B] px-3 
                     text-gray-600 dark:text-white text-[16px] font-medium">
          Iniciativa:
        </span>
        <!-- logos -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-12 mt-4">
          
          <!-- Logo UnB -->
          <a href="https://www.unb.br" target="_blank" rel="noopener noreferrer"
             class="transition-transform duration-300 ease-out hover:scale-105">
            <img src="home/partners/unb.svg"
                 alt="UnB"
                 class="h-[80px] w-auto object-contain" />
          </a>

          <!-- Logo Lab Livre -->
          <a href="https://www.instagram.com/lab.livre/"
             target="_blank" rel="noopener noreferrer"
             class="transition-transform duration-300 ease-out hover:scale-105 relative inline-block">
            <!-- Versão para modo claro -->
            <img src="home/partners/lablivre.png"
                 alt="Lab Livre"
                 class="h-[80px] w-auto object-contain block dark:hidden" />
            <!-- Versão para modo escuro -->
            <img src="home/partners/lablivre-white.png"
                 alt="Lab Livre"
                 class="h-[80px] w-auto object-contain hidden dark:block" />
          </a>

        </div>
      </div>

      <!-- BLOCO APOIO -->
      <div class="relative rounded-2xl border-2 border-[#E8611D] px-8 py-10 flex flex-col items-center">
        <!-- título embutido na borda -->
        <span data-i18n="partners_support"
              class="absolute -top-3 bg-white dark:bg-[#0E1A2B] px-3 
                     text-gray-600 dark:text-white text-[16px] font-medium">
          Apoio:
        </span>
        <!-- logo -->
        <div class="flex items-center justify-center mt-4">
          <a href="https://www.fap.df.gov.br" target="_blank" rel="noopener noreferrer"
             class="transition-transform duration-300 ease-out hover:scale-105">
            <img src="home/partners/fapdf.svg"
                 alt="FAPDF"
                 class="h-[90px] w-auto object-contain" />
          </a>
        </div>
      </div>

    </div>
  </div>
</section>
