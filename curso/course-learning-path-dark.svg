<svg width="900" height="650" viewBox="-20 -20 900 650" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Material de formacao DermAlert em modo escuro</title>
  <desc id="desc">Manual de curso em modo escuro com fichas clinicas, checklist, amostra e certificado soltos sobre fundo transparente.</desc>
  <defs>
    <filter id="book-shadow" x="96" y="116" width="744" height="478" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000000" flood-opacity=".34"/>
    </filter>
    <filter id="lift-shadow" x="-30%" y="-35%" width="170%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity=".26"/>
    </filter>
    <style>
      .float{animation:float 6s ease-in-out infinite;transform-origin:center}
      .float2{animation:float 7s ease-in-out infinite reverse;transform-origin:center}
      .meter{animation:meter 4.4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes meter{0%,100%{transform:scaleX(.52)}50%{transform:scaleX(1)}}
      @media (prefers-reduced-motion:reduce){.float,.float2,.meter{animation:none}}
    </style>
  </defs>

