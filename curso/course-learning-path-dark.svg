      <text x="49" y="30" text-anchor="middle" fill="#F0A06D" font-family="Lexend, Arial, sans-serif" font-size="12" font-weight="900">CASO</text>
      <text x="49" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="16" font-weight="900">01</text>
