    <path d="M32 47h20M42 37v20" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <text x="82" y="40" fill="#FFFFFF" font-family="Lexend, Arial, sans-serif" font-size="13" font-weight="900">PRATICA</text>
    <text x="82" y="61" fill="#F0A06D" font-family="Lexend, Arial, sans-serif" font-size="12" font-weight="800">guiada</text>
